version: '3.8'

services:
  python-agent:
    build:
      context: .
      dockerfile: apps/agent-python/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - AGENT_CORE_STORE_BACKEND=sqlite
      - CHROMA_DB_PATH=/data/chroma
      - MCP_SEARCH_ENABLED=${MCP_SEARCH_ENABLED:-true}
      - MCP_SEARCH_SERVER_URL=${MCP_SEARCH_SERVER_URL:-http://host.docker.internal:3210}
    volumes:
      - agent_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/agent/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  java-backend:
    build:
      context: apps/api-java
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - AGENT_BASE_URL=http://python-agent:8001
      - JWT_SECRET=${JWT_SECRET:-deep-research-demo-secret}
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      python-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agent_data:
