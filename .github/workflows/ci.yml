name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" || pip install ruff pytest pytest-asyncio
      - run: ruff check apps/agent-python/ packages/
      - run: cd apps/agent-python && PYTHONPATH=. python -m pytest --collect-only 2>&1 | head -5

  java-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - run: cd apps/api-java && mvn verify -q
