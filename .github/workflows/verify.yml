name: verify

on:
  push:
  pull_request:

jobs:
  python-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-python
    env:
      DEEPSEEK_API_KEY: offline-ci-key
      EMBEDDING_MODE: deterministic
      AGENT_RUNTIME_PROFILE: offline
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/agent-python/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Verify independent stdio process and miss-promote-dense closure
        run: python -m pytest tests/integrations/test_stdio_session.py tests/integration/test_miss_promote_hit.py -q
      - name: Enforce numeric and per-case release gates
        run: python -m evals.runner --suite all --offline --fail-on-regression --report evals/reports/generated/ci-offline.json
      - name: Archive reproducible evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: apps/agent-python/evals/reports/generated/ci-offline.*

  qdrant-integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
        env:
          QDRANT__SERVICE__API_KEY: ci-qdrant-key
    defaults:
      run:
        working-directory: apps/agent-python
    env:
      RUN_QDRANT_INTEGRATION: "1"
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: ci-qdrant-key
      DEEPSEEK_API_KEY: offline-ci-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/agent-python/requirements.txt
      - run: pip install -r requirements.txt
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent -H "api-key: $QDRANT_API_KEY" "$QDRANT_URL/collections" && exit 0
            sleep 1
          done
          exit 1
      - run: python -m pytest tests/integration/test_qdrant_service.py -q

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn test --batch-mode

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
