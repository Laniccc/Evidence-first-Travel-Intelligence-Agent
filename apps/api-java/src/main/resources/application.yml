server:
  port: 8082

spring:
  application:
    name: deep-research-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
# --- Dev Profile (H2 in-memory) ---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/deep_research;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

---
# --- Prod Profile (PostgreSQL) ---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/deep_research
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:deepresearch}
    password: ${DB_PASSWORD:deepresearch}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

---
# --- Common Config ---
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration

agent:
  base-url: ${AGENT_BASE_URL:http://localhost:8001}
  connect-timeout: 5s
  read-timeout: ${AGENT_READ_TIMEOUT:300s}

jwt:
  secret: ${JWT_SECRET:deep-research-agent-demo-secret-key-change-in-production}
  expiration-ms: 86400000

research:
  max-concurrent: ${RESEARCH_MAX_CONCURRENT:3}
  default-quota-daily: ${RESEARCH_DEFAULT_QUOTA_DAILY:10}
