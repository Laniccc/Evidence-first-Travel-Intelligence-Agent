spring:
  datasource:
    url: jdbc:h2:mem:api-java-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  security:
    jwt:
      secret: test-secret-with-enough-length-for-hmac
      ttl-minutes: 60
